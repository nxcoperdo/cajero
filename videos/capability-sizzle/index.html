<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b0c;
      }
      body {
        font-family: "League Gothic", "Oswald", sans-serif;
        color: #f2efe9;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      #stage { position: absolute; inset: 0; overflow: hidden; }

      /* 12-column margin grid — flashes once at the lockup */
      #grid { position: absolute; inset: 0; }
      #grid .col {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #f2efe9;
      }

      /* ---- scene 1 + 2 : the measuring rule ---- */
      #rulegroup {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 730px 620px;
      }
      #rule-line {
        position: absolute;
        left: 200px;
        top: 620px;
        width: 1520px;
        height: 1px;
        background: #7c7972;
        transform-origin: left center;
      }
      #semanas {
        position: absolute;
        left: 200px;
        top: 432px;
        font-size: 158px;
        line-height: 1;
        white-space: nowrap;
        transform-origin: left center;
      }
      /* tracking is animated per glyph via transforms — never letter-spacing */
      #semanas .ch { display: inline-block; transform-origin: left center; }

      .tick {
        position: absolute;
        top: 632px;
        font-size: 22px;
        letter-spacing: 0.18em;
        color: #7c7972;
        transform-origin: center top;
      }
      .tick::before {
        content: "";
        position: absolute;
        left: 0;
        top: -12px;
        width: 1px;
        height: 10px;
        background: #7c7972;
      }

      /* ---- scene 3 : the release ---- */
      #minutos {
        position: absolute;
        left: 200px;
        top: 398px;
        font-size: 232px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #ff4a1c;
        white-space: nowrap;
        transform-origin: left center;
      }
      #readout {
        position: absolute;
        left: 200px;
        top: 700px;
        font-size: 26px;
        letter-spacing: 0.24em;
        color: #7c7972;
      }
      #accent-rule {
        position: absolute;
        left: 200px;
        top: 668px;
        width: 430px;
        height: 2px;
        background: #ff4a1c;
        transform-origin: left center;
      }

      /* ---- scene 4 + 5 : the statement ---- */
      #statement {
        position: absolute;
        left: 200px;
        top: 404px;
        font-size: 104px;
        line-height: 1.08;
        letter-spacing: 0.005em;
      }
      #statement .line { display: block; white-space: nowrap; }
      #statement .w { display: inline-block; }
      #w-minutos { position: relative; color: #ff4a1c; }
      #w-semanas { position: relative; color: #7c7972; }
      #underline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        height: 4px;
        background: #ff4a1c;
        transform-origin: left center;
      }
      #strike {
        position: absolute;
        left: -4px;
        right: -4px;
        top: 56%;
        height: 3px;
        background: #ff4a1c;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="grid">
          <div class="col" style="left: 200px"></div>
          <div class="col" style="left: 393px"></div>
          <div class="col" style="left: 586px"></div>
          <div class="col" style="left: 779px"></div>
          <div class="col" style="left: 972px"></div>
          <div class="col" style="left: 1165px"></div>
          <div class="col" style="left: 1358px"></div>
          <div class="col" style="left: 1551px"></div>
          <div class="col" style="left: 1720px"></div>
        </div>

        <div id="rulegroup">
          <div id="rule-line"></div>
          <div id="semanas"><span class="ch">S</span><span class="ch">E</span><span class="ch">M</span><span class="ch">A</span><span class="ch">N</span><span class="ch">A</span><span class="ch">S</span></div>
          <div class="tick mono" style="left: 200px">S1</div>
          <div class="tick mono" style="left: 580px">S2</div>
          <div class="tick mono" style="left: 960px">S3</div>
          <div class="tick mono" style="left: 1340px">S4</div>
        </div>

        <div id="minutos">MINUTOS</div>
        <div id="accent-rule"></div>
        <div id="readout" class="mono">00:12</div>

        <div id="statement">
          <span class="line">Producción de video</span>
          <span class="line"
            >en <span class="w" id="w-minutos">minutos<i id="underline"></i></span
            >, no en <span class="w" id="w-semanas">semanas<i id="strike"></i></span></span
          >
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const chars = gsap.utils.toArray("#semanas .ch");
      const ticks = gsap.utils.toArray(".tick");
      const lines = gsap.utils.toArray("#statement .line");

      // Tracking is a per-glyph x offset, not letter-spacing: transforms
      // interpolate sub-pixel, letter-spacing snaps to device pixels and
      // stutters under the seek-by-frame capture engine.
      const TRACK_OPEN = 44; // 0.28em at 158px
      const TRACK_TIGHT = -6.3; // -0.04em at 158px

      // --- initial state: immediate, outside the timeline, so frame 0 is exact ---
      gsap.set("#rule-line", { scaleX: 0 });
      gsap.set("#semanas", { y: 44, opacity: 0 });
      gsap.set(chars, { x: (i) => i * TRACK_OPEN });
      gsap.set("#rulegroup", { scaleX: 1, opacity: 1, filter: "blur(0px)" });
      gsap.set(ticks, { y: 14, opacity: 0 });
      gsap.set("#minutos", { opacity: 0, scale: 0.62 });
      gsap.set("#readout", { opacity: 0, x: -18 });
      gsap.set("#accent-rule", { scaleX: 0 });
      gsap.set("#statement", { opacity: 0 });
      gsap.set(lines, { y: 26, opacity: 0 });
      gsap.set("#grid", { opacity: 0 });
      gsap.set("#underline", { scaleX: 0 });
      gsap.set("#strike", { scaleX: 0 });

      const tl = gsap.timeline({ paused: true });

      // --- scene 1 : rule (0 – 2.4) the status quo, drawn to scale ---
      tl.to("#rule-line", { scaleX: 1, duration: 0.35, ease: "power4.out" }, 0.0)
        .to("#semanas", { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.15)
        .to(ticks, { y: 0, opacity: 1, duration: 0.3, stagger: 0.07, ease: "power2.out" }, 0.35)
        .to("#rulegroup", { scale: 1.006, duration: 1.5, ease: "sine.inOut" }, 0.9);

      // --- scene 2 : compress (2.4 – 4.5) the one pattern interrupt ---
      tl.to(chars, { x: (i) => i * TRACK_TIGHT, duration: 0.78, ease: "expo.in" }, 2.4)
        .to(ticks, {
          x: (i) => [530, 150, -230, -610][i],
          opacity: 0,
          duration: 0.62,
          stagger: { each: 0.05, from: "edges" },
          ease: "expo.in",
        }, 2.4)
        .to("#rulegroup", { scaleX: 0.55, duration: 0.78, ease: "expo.in" }, 2.4)
        .to("#rulegroup", { filter: "blur(6px)", duration: 0.4, ease: "power2.in" }, 2.72)
        .to("#rulegroup", { filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, 3.2)
        // the collapse IS the exit — the text never fades on its own
        .to("#rulegroup", { scaleX: 0.04, opacity: 0, duration: 0.42, ease: "expo.in" }, 4.05);

      // --- scene 3 : minutos (4.5 – 7.2) release and impact ---
      tl.to("#minutos", { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(2.2)" }, 4.5)
        .to("#minutos", { x: 3, duration: 0.05, ease: "none", yoyo: true, repeat: 1 }, 4.84)
        .to("#accent-rule", { scaleX: 1, duration: 0.32, ease: "power4.out" }, 4.78)
        .to("#readout", { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 4.9)
        .to("#minutos", {
          filter: "drop-shadow(0 0 26px rgba(255,74,28,0.55))",
          duration: 0.3,
          ease: "power2.out",
        }, 4.9)
        .to("#minutos", {
          filter: "drop-shadow(0 0 0px rgba(255,74,28,0))",
          duration: 0.7,
          ease: "power2.inOut",
        }, 5.4);

      // --- scene 4 : statement (7.2 – 9.8) MINUTOS demotes into the line ---
      tl.to("#minutos", { scale: 0.448, x: 24, y: 132, duration: 0.52, ease: "power3.inOut" }, 7.2)
        .to("#accent-rule", { scaleX: 0, duration: 0.3, ease: "power3.in" }, 7.2)
        .to("#readout", { opacity: 0, duration: 0.24, ease: "power2.in" }, 7.2)
        .to("#minutos", { opacity: 0, duration: 0.18, ease: "none" }, 7.66)
        .to("#statement", { opacity: 1, duration: 0.01, ease: "none" }, 7.66)
        .to(lines, { y: 0, opacity: 1, duration: 0.46, stagger: 0.12, ease: "power3.out" }, 7.66);

      // --- scene 5 : lockup (9.8 – 12) retire the old unit, hold, hard cut ---
      tl.to("#strike", { scaleX: 1, duration: 0.3, ease: "power2.out" }, 9.8)
        .to("#grid", { opacity: 0.12, duration: 0.18, ease: "power2.out" }, 10.15)
        .to("#grid", { opacity: 0, duration: 0.34, ease: "power2.inOut" }, 10.55)
        .to("#underline", { scaleX: 1, duration: 0.34, ease: "power4.out" }, 11.4);

      tl.seek(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
